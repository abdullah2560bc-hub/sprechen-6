// ==========================================
// إعدادات مفتاح الـ API والتخزين الثلاثي الدائم 100% (LocalStorage + SessionStorage + Cookies)
// لكي لا يضيع المفتاح أبداً عند عمل Refresh للصفحة
// ==========================================
const API_KEY_STORAGE_NAME = "deutsch_turbo_api_key_v3";
const API_KEY_ALT_NAME = "deutsch_turbo_gemini_api_key";
const LEGACY_KEY_STORAGE_NAME = "deutsch-turbo-api-key";
const ACTIVE_MODEL_STORAGE_NAME = "deutsch_turbo_active_model";

const sanitizeApiKey = (raw) => {
    if (!raw || typeof raw !== "string") return "";
    return raw.trim().replace(/[\s"'`]+/g, "");
};

const readCookieValue = (name) => {
    try {
        const match = document.cookie.match(new RegExp("(^| )" + name + "=([^;]+)"));
        if (match && match[2]) return decodeURIComponent(match[2]);
    } catch (_) {}
    return "";
};

const writeCookieValue = (name, val) => {
    try {
        if (val) {
            document.cookie = `${name}=${encodeURIComponent(val)}; max-age=31536000; path=/; SameSite=Lax`;
        } else {
            document.cookie = `${name}=; max-age=0; path=/; SameSite=Lax`;
        }
    } catch (_) {}
};

const readStoredApiKey = () => {
    try {
        const candidates = [
            window.localStorage?.getItem(API_KEY_STORAGE_NAME),
            window.localStorage?.getItem(API_KEY_ALT_NAME),
            window.localStorage?.getItem(LEGACY_KEY_STORAGE_NAME),
            window.sessionStorage?.getItem(API_KEY_STORAGE_NAME),
            readCookieValue(API_KEY_STORAGE_NAME)
        ];
        for (const c of candidates) {
            const cleaned = sanitizeApiKey(c);
            if (cleaned && cleaned.length >= 10) return cleaned;
        }
    } catch (_) {}
    const cookieFallback = sanitizeApiKey(readCookieValue(API_KEY_STORAGE_NAME));
    return cookieFallback.length >= 10 ? cookieFallback : "";
};

const writeStoredApiKey = (rawKey) => {
    const cleanKey = sanitizeApiKey(rawKey);
    try {
        if (cleanKey) {
            window.localStorage?.setItem(API_KEY_STORAGE_NAME, cleanKey);
            window.localStorage?.setItem(API_KEY_ALT_NAME, cleanKey);
            window.localStorage?.setItem(LEGACY_KEY_STORAGE_NAME, cleanKey);
            window.sessionStorage?.setItem(API_KEY_STORAGE_NAME, cleanKey);
        } else {
            window.localStorage?.removeItem(API_KEY_STORAGE_NAME);
            window.localStorage?.removeItem(API_KEY_ALT_NAME);
            window.localStorage?.removeItem(LEGACY_KEY_STORAGE_NAME);
            window.sessionStorage?.removeItem(API_KEY_STORAGE_NAME);
        }
    } catch (_) {}
    writeCookieValue(API_KEY_STORAGE_NAME, cleanKey);
};

const readStoredActiveModel = () => {
    try {
        return window.localStorage?.getItem(ACTIVE_MODEL_STORAGE_NAME) || "gemini-3.5-flash-lite";
    } catch (_) {
        return "gemini-3.5-flash-lite";
    }
};

const writeStoredActiveModel = (modelName) => {
    if (!modelName) return;
    try {
        window.localStorage?.setItem(ACTIVE_MODEL_STORAGE_NAME, modelName);
    } catch (_) {}
};

// تنظيف الموديل المحفوظ إذا كان قديماً (مثل 1.5 أو 2.0 أو 2.5 الذي أوقفته جوجل للمستخدمين الجدد)
const getInitialModel = () => {
    const saved = readStoredActiveModel();
    if (!saved || saved.includes("1.5") || saved.includes("2.0") || saved.includes("2.5")) {
        return "gemini-3.5-flash-lite";
    }
    return saved;
};

// قائمة الموديلات الحديثة المعتمدة مرتبة حسب الأحدث (3.5 ثم latest ثم 3.1/3.0)
let discoveredModelsCache = [
    getInitialModel(),
    "gemini-3.5-flash-lite",
    "gemini-3.5-flash",
    "gemini-flash-lite-latest",
    "gemini-flash-latest",
    "gemini-3.1-flash-lite",
    "gemini-3.1-flash",
    "gemini-3-flash-preview"
].filter((v, i, a) => Boolean(v) && a.indexOf(v) === i);

// استعلام فعلي من سيرفر جوجل لجلب الموديلات المتاحة لمفتاح المستخدم واختبار التوليد الحقيقي
async function verifyApiKeyWithGoogle(cleanKey) {
    if (!cleanKey || cleanKey.length < 15) {
        throw new Error("INVALID_KEY: المفتاح قصير جداً أو غير مكتمل.");
    }

    // 1. الموديلات الحديثة المعتمدة للمستخدمين الجدد في Google AI Studio
    let candidateModels = [
        "gemini-3.5-flash-lite",
        "gemini-3.5-flash",
        "gemini-flash-lite-latest",
        "gemini-flash-latest",
        "gemini-3.1-flash-lite",
        "gemini-3.1-flash",
        "gemini-3-flash-preview",
        "gemini-2.5-flash"
    ];

    try {
        const listRes = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(cleanKey)}`
        );
        if (!listRes.ok) {
            let errJson = null;
            try { errJson = await listRes.json(); } catch (_) {}
            const msg = errJson?.error?.message || `HTTP ${listRes.status}`;
            if (listRes.status === 400 || /API key not valid|API_KEY_INVALID/i.test(msg)) {
                throw new Error(`INVALID_KEY: ${msg}`);
            }
            if (listRes.status === 403) {
                throw new Error(`FORBIDDEN_KEY: ${msg}`);
            }
        } else {
            const listData = await listRes.json();
            if (Array.isArray(listData?.models)) {
                const availableNames = listData.models
                    .filter((m) => Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes("generateContent"))
                    .map((m) => (m.name || "").replace(/^models\//, ""))
                    .filter((name) => name.startsWith("gemini-") && !name.includes("tts") && !name.includes("image") && !name.includes("embedding") && !name.includes("vision"));

                const preferredOrder = [
                    "gemini-3.5-flash-lite",
                    "gemini-3.5-flash",
                    "gemini-3.5-flash-lite-preview",
                    "gemini-3.5-flash-preview",
                    "gemini-flash-lite-latest",
                    "gemini-flash-latest",
                    "gemini-3.1-flash-lite",
                    "gemini-3.1-flash",
                    "gemini-3-flash-preview",
                    "gemini-3.5-pro",
                    "gemini-2.5-flash",
                    "gemini-2.5-flash-lite"
                ];

                const prioritized = preferredOrder.filter((p) => availableNames.includes(p));
                const others3x = availableNames.filter((a) => (a.includes("3.5") || a.includes("3.1") || a.includes("latest")) && !prioritized.includes(a));
                const othersRest = availableNames.filter((a) => a.includes("flash") && !prioritized.includes(a) && !others3x.includes(a));
                const combined = [...prioritized, ...others3x, ...othersRest];
                if (combined.length > 0) {
                    candidateModels = [
                        "gemini-3.5-flash-lite",
                        ...combined.filter((m) => m !== "gemini-3.5-flash-lite")
                    ];
                }
            }
        }
    } catch (err) {
        if (err.message?.startsWith("INVALID_KEY:") || err.message?.startsWith("FORBIDDEN_KEY:")) {
            throw err;
        }
    }

    // 2. اختبار توليد حقيقي مع التقاط أي موديل تقترحه جوجل تلقائياً في رسالة الخطأ
    let lastError = null;
    const queue = [...candidateModels];
    const testedSet = new Set();

    while (queue.length > 0 && testedSet.size < 8) {
        const modelName = queue.shift();
        if (!modelName || testedSet.has(modelName)) continue;
        testedSet.add(modelName);

        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(cleanKey)}`;
            const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ role: "user", parts: [{ text: "Reply with one word: OK" }] }],
                    generationConfig: {
                        maxOutputTokens: 10,
                        temperature: 0
                    }
                })
            });

            if (!res.ok) {
                let errJson = null;
                try { errJson = await res.json(); } catch (_) {}
                const msg = errJson?.error?.message || `HTTP ${res.status}`;
                if (res.status === 400 && /API key not valid|API_KEY_INVALID/i.test(msg)) {
                    throw new Error(`INVALID_KEY: ${msg}`);
                }
                if (res.status === 403) {
                    throw new Error(`FORBIDDEN_KEY: ${msg}`);
                }
                // إذا اقترحت جوجل موديل بديل في رسالة الخطأ (مثل models/gemini-3.5-flash-lite) نضعه في أول الطابور فوراً!
                const suggestedMatch = msg.match(/models\/(gemini-[a-zA-Z0-9._-]+)/i);
                if (suggestedMatch && suggestedMatch[1] && !testedSet.has(suggestedMatch[1])) {
                    queue.unshift(suggestedMatch[1]);
                }
                lastError = new Error(`${modelName}: ${msg}`);
                continue;
            }

            const data = await res.json();
            const replyText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (replyText) {
                writeStoredActiveModel(modelName);
                discoveredModelsCache = [
                    modelName,
                    ...candidateModels.filter((m) => m !== modelName)
                ];
                return modelName;
            }
        } catch (err) {
            if (err.message?.startsWith("INVALID_KEY:") || err.message?.startsWith("FORBIDDEN_KEY:")) {
                throw err;
            }
            lastError = err;
        }
    }

    throw lastError || new Error("تعذر الاتصال بأي موديل Gemini متاح على هذا المفتاح.");
}

// استخراج JSON بأمان تام من رد الذكاء الاصطناعي حتى لو أرسل علامات markdown
function parseJsonSafely(rawText) {
    if (!rawText) throw new Error("Empty AI text");
    const cleaned = rawText
        .replace(/^```(?:json)?\s*/i, "")
        .replace(/\s*```$/i, "")
        .trim();
    try {
        return JSON.parse(cleaned);
    } catch (_) {
        const match = rawText.match(/\{[\s\S]*\}/);
        if (match) {
            return JSON.parse(match[0]);
        }
        throw new Error("Invalid JSON format from AI");
    }
}

// ==========================================
// محرك الاتصال الحقيقي والموثوق بـ Gemini API
// ==========================================
async function callGeminiAPI({
    activeKey,
    userText,
    systemPrompt,
    temperature = 0.1,
    signal
}) {
    const cleanKey = sanitizeApiKey(activeKey || readStoredApiKey());

    // دعم العمل بمفتاح المستخدم على GitHub Pages مع البدء بموديل gemini-3.5-flash-lite الحديث
    const initialModelsList = cleanKey
        ? [
            getInitialModel(),
            ...discoveredModelsCache,
            "gemini-3.5-flash-lite",
            "gemini-3.5-flash",
            "gemini-flash-lite-latest",
            "gemini-flash-latest",
            "gemini-3.1-flash-lite",
            "gemini-3-flash-preview",
            "gemini-2.5-flash"
          ].filter((v, i, a) => Boolean(v) && a.indexOf(v) === i)
        : ["gemini-3.5-flash-lite", "gemini-3-flash-preview", "gemini-2.5-flash"];

    const queue = [...initialModelsList];
    const triedModels = new Set();
    let lastError = null;

    while (queue.length > 0 && triedModels.size < 8) {
        const modelName = queue.shift();
        if (!modelName || triedModels.has(modelName)) continue;
        triedModels.add(modelName);

        try {
            const payload = {
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                },
                contents: [
                    {
                        role: "user",
                        parts: [{ text: userText }]
                    }
                ],
                generationConfig: {
                    responseMimeType: "application/json",
                    temperature
                }
            };

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(cleanKey)}`;
            let response = await fetch(apiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
                signal
            });

            // إذا رفض الموديل خاصية responseMimeType، نعيد المحاولة بطلب نصي قياسي متوافق 100%
            if (response.status === 400) {
                let errCheck = null;
                try { errCheck = await response.json(); } catch (_) {}
                const errMsg = errCheck?.error?.message || "";
                if (/API key not valid|API_KEY_INVALID/i.test(errMsg)) {
                    throw new Error(`INVALID_KEY: ${errMsg}`);
                }
                // فحص إن كان الخطأ بسبب إيقاف الموديل واقتراح موديل أحدث مثل gemini-3.5-flash-lite
                const suggestedIn400 = errMsg.match(/models\/(gemini-[a-zA-Z0-9._-]+)/i);
                if (suggestedIn400 && suggestedIn400[1] && !triedModels.has(suggestedIn400[1])) {
                    queue.unshift(suggestedIn400[1]);
                    throw new Error(`MODEL_DEPRECATED: ${errMsg}`);
                }
                const fallbackPayload = {
                    contents: [
                        {
                            role: "user",
                            parts: [{ text: `${systemPrompt}\n\nالنص المطلوب معالجته:\n${userText}\n\nأرجع JSON صالح فقط بدون أي كلام خارجه.` }]
                        }
                    ],
                    generationConfig: { temperature }
                };
                response = await fetch(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(fallbackPayload),
                    signal
                });
            }

            if (!response.ok) {
                let errData = null;
                try { errData = await response.json(); } catch (_) {}
                const apiErrMsg = errData?.error?.message || `HTTP ${response.status}`;

                if (response.status === 400 && /API key not valid|API_KEY_INVALID/i.test(apiErrMsg)) {
                    throw new Error(`INVALID_KEY: ${apiErrMsg}`);
                }
                if (response.status === 403) {
                    throw new Error(`FORBIDDEN_KEY: ${apiErrMsg}`);
                }
                if (!cleanKey && (response.status === 400 || response.status === 401 || response.status === 403)) {
                    throw new Error("NO_API_KEY");
                }
                // إذا اقترح السيرفر موديل بديل في رسالة الخطأ، نضعه في بداية الطابور فوراً
                const suggestedModel = apiErrMsg.match(/models\/(gemini-[a-zA-Z0-9._-]+)/i);
                if (suggestedModel && suggestedModel[1] && !triedModels.has(suggestedModel[1])) {
                    queue.unshift(suggestedModel[1]);
                }
                throw new Error(`MODEL_${modelName}_${response.status}: ${apiErrMsg}`);
            }

            const data = await response.json();
            const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!rawText) {
                throw new Error("EMPTY_CANDIDATE");
            }

            const parsed = parseJsonSafely(rawText);
            if (cleanKey) {
                writeStoredActiveModel(modelName);
            }
            return { parsed, usedModel: modelName };
        } catch (err) {
            if (err.name === "AbortError") throw err;
            if (
                err.message === "NO_API_KEY" ||
                err.message?.startsWith("INVALID_KEY:") ||
                err.message?.startsWith("FORBIDDEN_KEY:")
            ) {
                throw err;
            }
            lastError = err;
        }
    }

    if (!cleanKey) {
        throw new Error("NO_API_KEY");
    }
    throw lastError || new Error("ALL_MODELS_FAILED");
}

// استخراج آخر جملة أو مقطع منطوق لربط الأمثلة الشبيهة به مباشرة
const getLastClauseOrChunk = (str) => {
    if (!str)
        return "";
    const clauses = str
        .split(/[.!؟?,،\n]+/)
        .map((s) => s.trim())
        .filter(Boolean);
    const lastClause = clauses[clauses.length - 1] || str.trim();
    const words = lastClause.split(/\s+/);
    return words.length > 7 ? words.slice(-6).join(" ") : lastClause;
};

// تنسيق الثواني إلى (MM:SS) أو (HH:MM:SS)
const formatDuration = (totalSeconds) => {
    const safeSec = Math.max(0, Math.floor(totalSeconds || 0));
    const hours = Math.floor(safeSec / 3600);
    const mins = Math.floor((safeSec % 3600) / 60);
    const secs = safeSec % 60;
    const pad = (n) => String(n).padStart(2, "0");
    if (hours > 0) {
        return `${pad(hours)}:${pad(mins)}:${pad(secs)}`;
    }
    return `${pad(mins)}:${pad(secs)}`;
};

                germanEquivalent: entry.articleDe,
                arabicPronunciation: entry.pron
            };
        }
    }
    if (/ich\s+bin\s+kalt/i.test(draftGerman)) {
        draftGerman = draftGerman.replace(/ich\s+bin\s+kalt/gi, "Mir ist kalt");
        replacedWords.push({
            wrongOrArabic: "Ich bin kalt",
            rightGerman: "Mir ist kalt",
            arabicMeaning: "أنا أشعر بالبرد",
            alternatives: INSTANT_WORD_ALTERNATIVES["mir ist kalt"].alternatives
        });
    }
    if (/trinke\s+eine\s+zigarette/i.test(draftGerman)) {
        draftGerman = draftGerman.replace(/trinke/gi, "rauche");
        replacedWords.push({
            wrongOrArabic: "trinke",
            rightGerman: "rauche",
            arabicMeaning: "أدخن",
            alternatives: INSTANT_WORD_ALTERNATIVES["rauche"].alternatives
        });
    }
    const tokens = draftGerman
        .replace(/[.!?,،؟]/g, "")
        .split(/\s+/)
        .filter(Boolean);
    const translatedTokens = tokens.map((tok) => {
        const clean = tok.toLowerCase();
        if (GERMAN_TO_ARABIC_QUICK[clean])
            return GERMAN_TO_ARABIC_QUICK[clean];
        return tok;
    });
    const hasAnyArabicChars = /[\u0600-\u06FF]/.test(trimmed);
    const isLocallyModified = replacedWords.length > 0 || hasAnyArabicChars;
    return {
        userSentence: trimmed,
        isCorrect: !isLocallyModified && (currentResult?.isCorrect ?? true),
        correctedGerman: draftGerman,
        arabicMeaning: translatedTokens.join(" ") ||
            currentResult?.arabicMeaning ||
            "جاري الترجمة اللحظية بالذكاء الاصطناعي...",
        lastArabicChunk: detectedArabicChunk ||
            currentResult?.lastArabicChunk || {
            hasArabic: false,
            arabicSpoken: "",
            germanEquivalent: "",
            arabicPronunciation: ""
        },
        replacedWords: replacedWords.length > 0
            ? replacedWords
            : currentResult?.replacedWords || [],
        contextAndLogic: currentResult?.contextAndLogic ||
            "جاري تحليل السياق والمنطق بالذكاء الاصطناعي...",
        similarExamples: currentResult?.similarExamples || [],
        isLiveDraft: true
    };
}
